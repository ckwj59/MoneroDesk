name: CodeQL Security Review
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp, csharp]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unpack pinned RandomX corresponding source
        if: matrix.language == 'c-cpp'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          target = Path('native').resolve()
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('engine/RandomX-source.zip') as archive:
              for item in archive.infolist():
                  if not (target/item.filename).resolve().is_relative_to(target):
                      raise ValueError('Archive entry escapes destination')
              archive.extractall(target)
          PY
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Save available analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
