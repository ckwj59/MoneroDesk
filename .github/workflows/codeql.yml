name: CodeQL Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unpack corresponding engine source for C/C++ analysis
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          target = Path('audit-source').resolve()
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile('source/xmrig-6.26.0-modified.zip') as archive:
              for item in archive.infolist():
                  if not (target / item.filename).resolve().is_relative_to(target):
                      raise ValueError('Archive path is outside the source directory')
              archive.extractall(target)
          PY
      - name: Initialize GitHub CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and upload security findings
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
