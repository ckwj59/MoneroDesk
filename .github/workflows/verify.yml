name: Verify distribution and protocol tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify public defaults and distributed file hashes
        run: python tests/verify_distribution.py
      - name: Run local protocol, TLS and recovery tests (no public mining)
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
