name: Verify distribution and protocol tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild desktop payload
        shell: pwsh
        run: ./build.ps1
      - name: Rebuild and verify the single-file installer
        shell: pwsh
        run: ./installer/build_installer.ps1
      - name: Run local protocol, TLS and recovery tests (no public mining)
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
